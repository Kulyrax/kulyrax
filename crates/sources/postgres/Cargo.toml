[package]
name = "kulyrax-source-postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Postgres outbox EventSource for Kulyrax: reads an outbox table in sequence order, read only."
keywords = ["cqrs", "event-sourcing", "postgres", "outbox"]
categories = ["database"]

[dependencies]
kulyrax-core = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The sync client, like kulyrax-adapter-postgres: it brings its own tokio
# runtime, which stays out of kulyrax-core.
postgres = "0.19"

[dev-dependencies]
serde_yaml = "0.9"
tempfile = "3"
rusqlite = { version = "0.43", features = ["bundled"] }

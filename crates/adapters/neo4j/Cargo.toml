[package]
name = "kulyrax-adapter-neo4j"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Neo4j graph backend for Kulyrax — a StorageAdapter/GraphBackend extension crate."
keywords = ["cqrs", "event-sourcing", "neo4j", "graph"]
categories = ["database"]

[dependencies]
kulyrax-core = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# `neo4rs` is async-only (Bolt protocol). The adapter wraps it in a small
# internal tokio runtime so dispatch stays synchronous; tokio stays private to
# this crate rather than leaking into kulyrax-core.
neo4rs = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
# Already a dependency of neo4rs; used to reproduce its URI parsing up front,
# because neo4rs itself only parses the URI when connecting.
url = "2"

[dev-dependencies]
tempfile = "3"

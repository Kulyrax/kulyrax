[package]
name = "kulyrax-adapter-redis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Redis key-value backend for Kulyrax — a StorageAdapter/KvBackend extension crate."
keywords = ["cqrs", "event-sourcing", "redis"]
categories = ["database"]

[dependencies]
kulyrax-core = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# The `r2d2` feature implements `r2d2::ManageConnection` on `redis::Client`,
# so no separate r2d2-redis crate is needed.
redis = { version = "1", features = ["r2d2"] }
r2d2 = "0.8"

[dev-dependencies]
tempfile = "3"

[package]
name = "kulyrax-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Deterministic event projection engine for CQRS/event-sourcing read models."
keywords = ["cqrs", "event-sourcing", "projection", "cdc"]
categories = ["database"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
once_cell = "1.19"
rusqlite = { version = "0.32", features = ["bundled"] }

# Phase 22: Redis key-value backend. Sync `redis` client; its own `r2d2`
# feature implements `r2d2::ManageConnection` directly on `redis::Client` —
# no separate r2d2-redis crate needed. `r2d2` itself stays a direct
# dependency (redis.rs uses `r2d2::Pool`/`PooledConnection` directly) even
# though Postgres's own r2d2 usage moved out with it in Phase 28.
redis = { version = "1", features = ["r2d2"] }
r2d2 = "0.8"

# Phase 23: MongoDB document backend. `sync` feature for a blocking API
# (matching the synchronous adapter path); no r2d2 pool needed — `Client` is
# already an internally-pooled, cheaply-cloneable handle.
mongodb = { version = "3", features = ["sync"] }

# Phase 24: Neo4j graph backend. `neo4rs` is async-only (Bolt protocol, no
# sync feature) — wrapped in a small internal `tokio` runtime, the same
# pattern Phase 19.2 used for the sync `postgres` crate over `tokio-postgres`.
neo4rs = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }

# Phase 25.3: MySQL SQL backend — a fifth, first-party SQL adapter alongside
# SQLite/Postgres, same `SqlTxn` seam. `mysql` is a sync client with its own
# internal connection pool (`Pool`), matching this adapter path's synchronous
# dispatch without a driver-owned async runtime. `minimal-rust` (pure-Rust
# flate2 backend, no system zlib) + `rustls-tls` (no openssl) keep this
# dependency-light the same way Postgres's `NoTls` avoids openssl.
mysql = { version = "28", default-features = false, features = ["minimal-rust", "derive", "buffer-pool", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[package]
name = "kulyrax-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Command-line runner for the Kulyrax projection engine."
keywords = ["cqrs", "event-sourcing", "cli", "projection"]
categories = ["command-line-utilities", "database"]
readme = "README.md"

[[bin]]
name = "kulyrax"
path = "src/main.rs"

[dependencies]
kulyrax-core = { workspace = true }
kulyrax-ingest = { workspace = true }
kulyrax-backends = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"
ctrlc = "3"

[dev-dependencies]
# The crash tests (tests/file_store_crash.rs) abort the binary at chosen points.
kulyrax-core = { workspace = true, features = ["crash-points"] }
tempfile = "3"
# tests/ordering.rs checks what reached Neo4j and Postgres; rename_migration.rs
# also sets up the SQL backends' target tables.
neo4rs = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
postgres = "0.19"
rusqlite = { version = "0.43", features = ["bundled"] }
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls"] }
# rename_migration.rs drops what it created on the MongoDB, Redis and
# Elasticsearch servers (the same client crates the adapters use).
mongodb = { version = "3", features = ["sync"] }
redis = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

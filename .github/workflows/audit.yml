name: Scheduled cargo audit

# The RustSec database changes without any change to this repository, so the
# advisory check also runs daily on main, not only on pull requests (ci.yml).
#
# Alert path: a failing run opens one issue labelled `cargo-audit` (or comments
# on the one already open; never a second); a passing run closes the open one
# with a link to the passing run. `force_fail` (manual runs only) runs the real
# audit, then fails, so the path can be tested without a real advisory.

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      force_fail:
        description: "Run the audit, then fail anyway (tests the issue path)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

env:
  LABEL: cargo-audit
  TITLE: "cargo audit: scheduled check failing"

jobs:
  audit:
    name: cargo audit (scheduled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Same loop and flags as the `cargo audit` job in ci.yml; ignores are in
      # .cargo/audit.toml.
      - name: cargo audit (workspace and examples)
        id: audit
        continue-on-error: true
        shell: bash
        env:
          FORCE_FAIL: ${{ inputs.force_fail }}
        run: |
          set -o pipefail
          (
            status=0
            for lock in Cargo.lock $(git ls-files 'examples/**/Cargo.lock'); do
              echo "== $lock"
              cargo audit --file "$lock" --deny unsound --deny unmaintained --deny yanked || status=1
            done
            if [ "$FORCE_FAIL" = "true" ]; then
              echo "== force_fail: the audit above ran for real; failing on purpose to test the alert path"
              status=1
            fi
            exit $status
          ) 2>&1 | tee audit-report.txt

      - name: open or update the audit issue
        if: steps.audit.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create "$LABEL" --color B60205 \
            --description "Scheduled cargo audit is failing" --force
          {
            echo "The scheduled \`cargo audit\` failed on \`${GITHUB_REF_NAME}\` ($(date -u +%Y-%m-%d)): $RUN_URL"
            echo
            echo '```'
            tail -c 60000 audit-report.txt
            echo '```'
          } > issue-body.md
          # The open audit issue, by label: there is at most one.
          number=$(gh issue list --state open --label "$LABEL" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file issue-body.md
            echo "updated issue #$number"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body-file issue-body.md
          fi

      - name: close the audit issue when passing again
        if: steps.audit.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for number in $(gh issue list --state open --label "$LABEL" --json number --jq '.[].number'); do
            gh issue close "$number" \
              --comment "The scheduled \`cargo audit\` passes again on \`${GITHUB_REF_NAME}\`: $RUN_URL"
            echo "closed issue #$number"
          done

      - name: fail the run when the audit failed
        if: steps.audit.outcome == 'failure'
        run: exit 1

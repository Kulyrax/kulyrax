# Config for `kulyrax ingest` — no `sources:` block needed; gRPC ingestion
# doesn't go through the directory/stdin source path (see examples/grpc-producer).
#
# Three real destinations, routed identically for every vehicle event type
# (see routing.json): Postgres and MongoDB are built into kulyrax-core /
# kulyrax-adapter-postgres; Elasticsearch is the new kulyrax-adapter-elasticsearch
# crate built specifically because this example needed a real third
# destination, not a mock (see this example's README "Capability assessment").
version: 1

# ContinueOnError, not the default FailFast: the three destinations below are
# independent, and a permanent failure in one (e.g. Elasticsearch rejecting a
# document) must not prevent the others from being attempted for the same
# event — FailFast stops at the first failing adapter in execution order and
# never even tries the rest. Found via kulyrax-ingest's
# grpc_dlq_count_reflects_a_real_cross_backend_failure test, which failed
# under the default policy for exactly this reason.
failure_policy: continue_on_error

routing:
  file: routing.json

adapters:
  - type: postgres
    id: sql-vehicles
    priority: 10
    capabilities: [write, upsert, delete, transactions]
    config:
      url: ${KULYRAX_PG_URL}
      pool_size: 4

  - type: mongodb
    id: mongo-vehicles
    priority: 10
    capabilities: [write, upsert, delete, transactions]
    config:
      url: ${KULYRAX_MONGO_URL}
      database: kulyrax
      pool_size: 4

  - type: elasticsearch
    id: es-vehicles
    priority: 10
    capabilities: [write, upsert, delete]
    config:
      url: ${KULYRAX_ELASTICSEARCH_URL}

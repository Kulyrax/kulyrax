event: VehicleUpdated
table: vehicles
primary_key: provider_vehicle_id
version: 1
on_existing: replace
columns:
  provider_vehicle_id: payload.provider_vehicle_id
  vin: payload.vin
  make: payload.make
  model: payload.model
  year: payload.year
  price: payload.price
  mileage: payload.mileage
  condition: payload.condition
  location: payload.location
  listing_status: payload.listing_status
  sold: payload.sold

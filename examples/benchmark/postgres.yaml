version: 1
routing:
  file: routing.yaml
adapters:
  - type: postgres
    id: store
    priority: 10
    capabilities: [write, upsert, delete, transactions]
    config:
      url: postgres://postgres:kulyrax@localhost:15432/bench
      pool_size: 4
sources:
  - type: directory
    id: bench
    path: ./work/events
    state_dir: ./work/state
